<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随时间变色的盒子 · 纯 CSS Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1020;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    overflow: hidden;
  }

  /* 背景跟随盒子颜色柔和变化，营造氛围 */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    animation: ambient 12s linear infinite;
    padding: 60px;
    border-radius: 24px;
  }

  @keyframes ambient {
    0%   { background: radial-gradient(circle at 50% 50%, rgba(255, 71, 87, 0.22), transparent 70%); }
    25%  { background: radial-gradient(circle at 50% 50%, rgba(255, 168, 1, 0.22), transparent 70%); }
    50%  { background: radial-gradient(circle at 50% 50%, rgba(46, 213, 115, 0.22), transparent 70%); }
    75%  { background: radial-gradient(circle at 50% 50%, rgba(30, 144, 255, 0.22), transparent 70%); }
    100% { background: radial-gradient(circle at 50% 50%, rgba(255, 71, 87, 0.22), transparent 70%); }
  }

  /* 核心盒子：4 种背景色随时间循环渐变 */
  .box {
    width: 260px;
    height: 260px;
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    animation: colorCycle 12s ease-in-out infinite;
  }

  /* 4 种颜色：红 → 橙 → 绿 → 蓝，12s 一轮，色相平滑过渡 */
  @keyframes colorCycle {
    0%   { background: #ff4757; }  /* 红 */
    25%  { background: #ffa801; }  /* 橙 */
    50%  { background: #2ed573; }  /* 绿 */
    75%  { background: #1e90ff; }  /* 蓝 */
    100% { background: #ff4757; }  /* 回到红，无缝循环 */
  }

  /* 颜色指示点，同步高亮当前颜色 */
  .dots {
    display: flex;
    gap: 14px;
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    opacity: 0.3;
    animation: dotPulse 12s ease-in-out infinite;
  }
  .dot:nth-child(1) { background: #ff4757; animation-delay: 0s; }
  .dot:nth-child(2) { background: #ffa801; animation-delay: 3s; }
  .dot:nth-child(3) { background: #2ed573; animation-delay: 6s; }
  .dot:nth-child(4) { background: #1e90ff; animation-delay: 9s; }

  @keyframes dotPulse {
    0%, 4%   { opacity: 1; transform: scale(1.35); }
    20%, 100% { opacity: 0.3; transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="box">COLOR</div>
    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
