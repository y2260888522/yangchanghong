<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 3D动画展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-size: 2.5em;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            padding: 20px;
        }
        
        .demo-box {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .demo-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 25px;
            font-weight: bold;
        }
        
        .scene {
            width: 200px;
            height: 200px;
            perspective: 600px;
            margin: 0 auto;
        }
        
        .cube {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCube 8s infinite linear;
        }
        
        .cube-face {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 3px solid rgba(255,255,255,0.8);
            opacity: 0.9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .front { 
            background: rgba(231,76,60,0.9); 
            transform: rotateY(0deg) translateZ(100px); 
        }
        .back { 
            background: rgba(46,204,113,0.9); 
            transform: rotateY(180deg) translateZ(100px); 
        }
        .right { 
            background: rgba(52,152,219,0.9); 
            transform: rotateY(90deg) translateZ(100px); 
        }
        .left { 
            background: rgba(155,89,182,0.9); 
            transform: rotateY(-90deg) translateZ(100px); 
        }
        .top { 
            background: rgba(241,196,15,0.9); 
            transform: rotateX(90deg) translateZ(100px); 
        }
        .bottom { 
            background: rgba(230,126,34,0.9); 
            transform: rotateX(-90deg) translateZ(100px); 
        }
        
        @keyframes rotateCube {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            25% { transform: rotateX(90deg) rotateY(90deg); }
            50% { transform: rotateX(180deg) rotateY(180deg); }
            75% { transform: rotateX(270deg) rotateY(270deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }
        
        .card-container {
            width: 250px;
            height: 170px;
            perspective: 1000px;
            margin: 0 auto;
            cursor: pointer;
        }
        
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: flipCard 4s infinite ease-in-out;
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            transform: rotateY(180deg);
        }
        
        @keyframes flipCard {
            0%, 45% { transform: rotateY(0deg); }
            50%, 95% { transform: rotateY(180deg); }
            100% { transform: rotateY(360deg); }
        }
        
        .rotate-object {
            width: 150px;
            height: 150px;
            margin: 25px auto;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate3D 6s infinite linear;
        }
        
        .ring {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 5px solid;
            border-radius: 50%;
            top: 0;
            left: 0;
        }
        
        .ring:nth-child(1) {
            border-color: rgba(231,76,60,0.8);
            transform: rotateX(60deg);
        }
        
        .ring:nth-child(2) {
            border-color: rgba(46,204,113,0.8);
            transform: rotateX(-60deg);
        }
        
        .ring:nth-child(3) {
            border-color: rgba(52,152,219,0.8);
            transform: rotateY(60deg);
        }
        
        @keyframes rotate3D {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }
        
        .pyramid-scene {
            width: 200px;
            height: 200px;
            perspective: 800px;
            margin: 0 auto;
        }
        
        .pyramid {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            animation: pyramidRotate 10s infinite linear;
        }
        
        .pyramid-face {
            position: absolute;
            width: 0;
            height: 0;
            left: 50%;
            top: 50%;
            transform-origin: center bottom;
        }
        
        .pyramid-face::before {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-left: 70px solid transparent;
            border-right: 70px solid transparent;
            border-bottom: 140px solid;
            left: -70px;
            top: -140px;
        }
        
        .pyramid-face:nth-child(1)::before { border-bottom-color: rgba(231,76,60,0.85); transform: rotateY(0deg) translateZ(70px) rotateX(30deg); }
        .pyramid-face:nth-child(2)::before { border-bottom-color: rgba(46,204,113,0.85); transform: rotateY(90deg) translateZ(70px) rotateX(30deg); }
        .pyramid-face:nth-child(3)::before { border-bottom-color: rgba(52,152,219,0.85); transform: rotateY(180deg) translateZ(70px) rotateX(30deg); }
        .pyramid-face:nth-child(4)::before { border-bottom-color: rgba(155,89,182,0.85); transform: rotateY(270deg) translateZ(70px) rotateX(30deg); }
        
        @keyframes pyramidRotate {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        
        .floating-cube {
            width: 120px;
            height: 120px;
            margin: 40px auto;
            position: relative;
            transform-style: preserve-3d;
            animation: floatAndSpin 5s infinite ease-in-out;
        }
        
        .floating-face {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 3px solid rgba(255,255,255,0.8);
            background: rgba(52,152,219,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
        
        .floating-face:nth-child(1) { transform: translateZ(60px); }
        .floating-face:nth-child(2) { transform: rotateY(180deg) translateZ(60px); }
        .floating-face:nth-child(3) { transform: rotateY(90deg) translateZ(60px); }
        .floating-face:nth-child(4) { transform: rotateY(-90deg) translateZ(60px); }
        .floating-face:nth-child(5) { transform: rotateX(90deg) translateZ(60px); }
        .floating-face:nth-child(6) { transform: rotateX(-90deg) translateZ(60px); }
        
        @keyframes floatAndSpin {
            0%, 100% { 
                transform: translateY(0) rotateX(0deg) rotateY(0deg); 
            }
            25% { 
                transform: translateY(-30px) rotateX(90deg) rotateY(90deg); 
            }
            50% { 
                transform: translateY(0) rotateX(180deg) rotateY(180deg); 
            }
            75% { 
                transform: translateY(-30px) rotateX(270deg) rotateY(270deg); 
            }
        }
        
        .carousel-scene {
            width: 220px;
            height: 160px;
            perspective: 1000px;
            margin: 20px auto;
        }
        
        .carousel {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: carouselRotate 12s infinite linear;
        }
        
        .carousel-item {
            position: absolute;
            width: 80px;
            height: 110px;
            left: 50%;
            top: 50%;
            margin-left: -40px;
            margin-top: -55px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .carousel-item:nth-child(1) { 
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a); 
            transform: rotateY(0deg) translateZ(130px); 
        }
        .carousel-item:nth-child(2) { 
            background: linear-gradient(135deg, #4ecdc4, #44a08d); 
            transform: rotateY(72deg) translateZ(130px); 
        }
        .carousel-item:nth-child(3) { 
            background: linear-gradient(135deg, #a8e063, #56ab2f); 
            transform: rotateY(144deg) translateZ(130px); 
        }
        .carousel-item:nth-child(4) { 
            background: linear-gradient(135deg, #f093fb, #f5576c); 
            transform: rotateY(216deg) translateZ(130px); 
        }
        .carousel-item:nth-child(5) { 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            transform: rotateY(288deg) translateZ(130px); 
        }
        
        @keyframes carouselRotate {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
                margin-bottom: 30px;
            }
            
            .container {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            
            .demo-box {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <h1>✨ CSS3 3D 动画展示 ✨</h1>
    
    <div class="container">
        <div class="demo-box">
            <div class="demo-title">🎲 3D 立方体旋转</div>
            <div class="scene">
                <div class="cube">
                    <div class="cube-face front">前</div>
                    <div class="cube-face back">后</div>
                    <div class="cube-face right">右</div>
                    <div class="cube-face left">左</div>
                    <div class="cube-face top">上</div>
                    <div class="cube-face bottom">下</div>
                </div>
            </div>
        </div>

        <div class="demo-box">
            <div class="demo-title">🃏 3D 卡片翻转</div>
            <div class="card-container">
                <div class="card">
                    <div class="card-face card-front">正面内容<br>点击翻转</div>
                    <div class="card-face card-back">背面内容<br>欢迎回来！</div>
                </div>
            </div>
        </div>

        <div class="demo-box">
            <div class="demo-title">🔮 3D 环形旋转</div>
            <div class="rotate-object">
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
            </div>
        </div>

        <div class="demo-box">
            <div class="demo-title">🔺 3D 金字塔</div>
            <div class="pyramid-scene">
                <div class="pyramid">
                    <div class="pyramid-face"></div>
                    <div class="pyramid-face"></div>
                    <div class="pyramid-face"></div>
                    <div class="pyramid-face"></div>
                </div>
            </div>
        </div>

        <div class="demo-box">
            <div class="demo-title">📦 悬浮立方体</div>
            <div class="floating-cube">
                <div class="floating-face">1</div>
                <div class="floating-face">2</div>
                <div class="floating-face">3</div>
                <div class="floating-face">4</div>
                <div class="floating-face">5</div>
                <div class="floating-face">6</div>
            </div>
        </div>

        <div class="demo-box">
            <div class="demo-title">🎠 3D 旋转木马</div>
            <div class="carousel-scene">
                <div class="carousel">
                    <div class="carousel-item">项目 1</div>
                    <div class="carousel-item">项目 2</div>
                    <div class="carousel-item">项目 3</div>
                    <div class="carousel-item">项目 4</div>
                    <div class="carousel-item">项目 5</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
