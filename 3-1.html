<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>表单form</h2>
    <form action="http://huanqiu.com" name="y1">
        <p>用户名:<input type="text" name="username" placeholder="请输入用户名"></p>
        <p>密码:<input type="password" name="password" placeholder="请输入密码"></p>
        <p>性别:
            <input type="radio" name="sex" value="male" checked>男
            <input type="radio" name="sex" value="female">女
            <input type="radio" name="sex" value="secret">保密
        </p>
        
        <p>爱好
            <input type="checkbox" name="hobbies" value="read">阅读
            <input type="checkbox" name="hobbies" value="game">游戏
            <input type="checkbox" name="hobbies" value="sport">运动
            <input type="checkbox" name="hobbies" value="music">音乐
        </p>

        <p>籍贯:
            <select name="nativePlace">
            <option value="">--请选择--</option>
            <option value="liaoning">辽宁省</option>
            <option value="guizhou">贵州省</option>
            </select>
        </p>
           
        <p>个人介绍:
            <textarea name="intr" rows="5" cols="30" placeholder="请简单介绍自己"></textarea>
        </p>

        <p>出生日期:
           <input type="text" name="birthday" placeholder="格式：2000‑01‑01">
       </p>

      <p>上传文件:
           <input type="file" name="upfile" accept="image/*">
      </p>

      <P>
           <input type="submit" value="提交">
           <input type="reset" value="重置">
     </P>





    </form>
</body>
</html>
