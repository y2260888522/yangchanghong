<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 样式重置：只清除内外边距，不设置宽高为0 */
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .title{
            width: 500px;
            height: 33px;
            line-height: 33px;
            padding: 10px;
            padding-right: 30px;
            margin: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title h2{
            font-size: 14px;
            color: blue;
            font-weight: normal;
        }
        .title a{
            font-size: 12px;
            color: #333;
            text-decoration: none;
        }
        /* 三个标题栏分别设置边框 */
        .title:nth-child(1){
            border: 1px solid #131212 ;
        }
        .title:nth-child(2){
            border-left:1px solid #abe13d;
            border-right:1px solid #98167c;
            border-top: 1px solid #4cb1e4;
        }
        .title:nth-child(3){
            border-left:1px solid #9fd64e;
            border-right:1px solid #df4848;
            border-bottom: 2px solid #2b9425;
            position: relative;
        }
        .title:nth-child(3) a{
            position: absolute;
            right: 15px;
            top: 0;
        }
    </style>
</head>
<body>
    <div class="title">
        <h2>ych的标题</h2>
        <a href="#">更多</a>
    </div>
    <div class="title">
        <h2>第二个标题</h2>
        <a href="#">更多</a>
    </div>
    <div class="title">
        <h2>第三个标题</h2>
        <a href="#">更多</a>
    </div>
</body>
</html>
