        *{margin: 0; padding: 0;}
        ul{list-style: none;}
        img{
            display: block;

        .slist{

        .slist li{
            width: 30%;

        }

        }

            line-height: 24px;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 5);
            color: #fff;
            font-weight: bold;


        }
    </style>
</head>
