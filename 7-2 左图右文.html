<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0;box-sizing: border-box;}
        .box{
            width: 500px;
            margin: 30px;
            display: flex;
            flex-direction: column; /* 纵向竖着排列 */
            gap: 0px; /* gap=0，卡片上下紧紧挨在一起 */
        }
        .zy{
            display: flex; /* 卡片内部依旧：左图右文 */
            gap:16px;
            border:1px solid #eee;
            padding:12px;
            /* border-radius:8px; */
        }
        .zy img{
            width:140px;
            height:100px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .text{
            flex:1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .text h3{
            font-size:18px;
            color:#222;
        }
        .author{
            font-size:13px;
            color:#666;
            margin-right:12px;
        }
        .time{
            font-size:13px;
            color:#999;
        }
    </style>
</head>
<body>
    <div class="box">
        <!-- 第1个卡片 -->
        <div class="zy">
            <img src="./1 (9).jpg">
            <div class="text">
                <h3>标题一</h3>
                <div>
                    <span class="author">ych</span>
                    <span class="time">2020-10-10</span>
                </div>
            </div>
        </div>
        <!-- 第2个卡片 -->
        <div class="zy">
            <img src="./1 (10).jpg">
            <div class="text">
                <h3>标题二</h3>
                <div>
                    <span class="author">ych</span>
                    <span class="time">2021-05-20</span>
                </div>
            </div>
        </div>
        <!-- 第3个卡片 -->
        <div class="zy">
            <img src="./1 (11).jpg">
            <div class="text">
                <h3>标题三</h3>
                <div>
                    <span class="author">ych</span>
                    <span class="time">2022-08-15</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
