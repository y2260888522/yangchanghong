<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .main{
        display:flex;
        flex-wrap: wrap;
        margin: 10px;
    }
    .box{
        width: 150px;
        height: 150px;
        border: 1px solid #ccc;
        margin: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 40px;
        transition: all 0.6s;
        box-sizing: border-box;
        position: relative; /* 新增：伪元素定位基准 */
    }
    .box:first-child:hover{
        background: red;
        color: white;
        font-size: 140px;
    }
    .box:nth-child(2):hover{
        border-radius: 50%;
        border-width: 10px;
    }
    .box:nth-child(3):hover{
        box-shadow: 10px 10px 10px red;
    }
    .box:nth-of-type(4):hover{
        text-shadow: 4px 10px 10px #ccc; /* 修改偏移，不再飞出 */
    }
    .box:nth-of-type(5):hover{
        background: linear-gradient(#000,#ccc,#fff);
    }
    .box:nth-of-type(5)+.box{
        background: radial-gradient(#fff,#ccc,#000);
    }
    .box:nth-of-type(7):hover{
        transform: scale(1.5);
    }
    .box:nth-of-type(8):hover{
        transform: translateX(-150px);
    }
    .box:nth-of-type(9):hover{
        transform: rotateZ(-180deg);
    }
    .box:nth-of-type(10):hover{
        transform: skewX(20deg) translateY(50px);
    }
    .box:nth-last-child(2):hover::before{
        content: "*";
        color: red;
        position:absolute;
        font-size:60px;
    }
    .box:nth-child(12):hover{
        background: #000;
        border: 3px solid red;
        color: transparent;
    }
    .box:nth-child(12):hover::after{
        content: "杨长鉷";
        color: #fff;
        font-size: 16px;
        position: absolute;
    }
   
    .box:nth-child(3n):hover{
        border:3px solid red;
    }
    
    .box:nth-child(odd){
        cursor: pointer;
    }

    .box:nth-child(even):hover{
        opacity:0.85;
    }
</style>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
